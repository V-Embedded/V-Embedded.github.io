---
layout: default
---

<article>
  <p>{{ page.category }}</p>
  <h1>{{ page.name }}</h1>
  <p>{{ page.description }}</p>
  {% if page.highlights %}
    <h2>Highlights</h2>
    <ul>
      {% for highlight in page.highlights %}<li>{{ highlight }}</li>{% endfor %}
    </ul>
  {% endif %}
  {{ content }}
</article>

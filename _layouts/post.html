---
layout: default
---

<article class="article-card tutorial-article">
  <a class="back-link" href="{{ '/tutorials/' | relative_url }}"><span aria-hidden="true">&larr;</span> All tutorials</a>
  <p class="card-label">{{ page.date | date: "%B %-d, %Y" }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="article-lede">{{ page.description }}</p>{% endif %}
  {{ content }}
</article>

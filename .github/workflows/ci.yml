name: Validate and Deploy

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: site-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run doctor
        run: npm run doctor

      - name: Build site
        run: npm run build

      - name: Proof generated site
        run: npm run proof

      - name: Verify build artifact
        run: test -f _site/index.html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Bump and commit site version
        run: |
          npm run version:bump
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json _data/site_version.yml
          git commit -m "chore: bump site version [skip ci]"
          git push origin HEAD:main

      - name: Run doctor
        run: npm run doctor

      - name: Build site
        run: npm run build

      - name: Proof generated site
        run: npm run proof

      - name: Verify build artifact
        run: test -f _site/index.html

      - name: Publish site to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin +gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach ../gh-pages origin/gh-pages
          cd ../gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/_site/." .
          touch .nojekyll
          git add --all
          git commit -m "deploy: ${GITHUB_SHA}" || exit 0
          git push origin HEAD:gh-pages

      - name: Refresh devel branch
        run: git push --force origin HEAD:devel